<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SakuKost - Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-box">
        <h2>Daftar SakuKost</h2>
        <p>Registrasi Penyewa Baru</p>
        <input type="text" placeholder="Nama Lengkap">
        <input type="text" placeholder="Username Baru">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <input type="text" placeholder="Nomor HP">
        <button onclick="alert('Registrasi Berhasil! Silahkan Login.'); window.location.href='index.html'">Daftar</button>
        <p class="auth-footer">Sudah punya akun? <a href="index.html">Login</a></p>
    </div>
</div>
</body>
</html>
