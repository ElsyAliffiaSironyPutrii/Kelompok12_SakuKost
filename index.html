<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakuKost - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-page" class="auth-container">
    <div class="auth-box">
        <h2>SakuKost</h2>
        <p>Silahkan Login</p>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <select id="role" onchange="checkRole()">
            <option value="admin">Pemilik / Admin</option>
            <option value="user">Penyewa Kost</option>
        </select>
        <button onclick="login()">Masuk</button>
        <p id="reg-link" class="auth-footer" style="display:none;">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
